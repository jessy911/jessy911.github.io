<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jessica Rieger — Visual Computing · VR/AR · Unreal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; overflow-x: hidden; }
      body {
        font-family: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background: oklch(0.972 0.008 80);
        color: oklch(0.20 0.012 60);
      }
      a { color: inherit; }
      ::selection { background: color-mix(in oklab, var(--accent, oklch(0.58 0.135 35)) 35%, transparent); }
      h1, h2, h3, p { text-wrap: pretty; }

      /* loader */
      .__boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: oklch(0.972 0.008 80); z-index: 100;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
        color: oklch(0.48 0.012 60);
      }

      /* ───────── responsive ───────── */
      @media (max-width: 820px) {
        /* Topbar: stack nav onto a second row, hide the "2026" status */
        header > div {
          grid-template-columns: 1fr auto !important;
          padding: 10px 14px !important;
          gap: 10px !important;
          row-gap: 8px !important;
        }
        header > div > span:first-child {
          font-size: 10px !important;
          letter-spacing: 0.1em !important;
        }
        header > div > nav {
          order: 3 !important;
          grid-column: 1 / -1 !important;
          justify-self: stretch !important;
          justify-content: flex-start !important;
          overflow-x: auto !important;
          scrollbar-width: none !important;
          gap: 2px !important;
          padding-bottom: 2px !important;
        }
        header > div > nav::-webkit-scrollbar { display: none !important; }
        header > div > nav button {
          padding: 6px 10px !important;
          font-size: 12.5px !important;
          flex-shrink: 0 !important;
        }
        /* Hide the "open/status" pill on mobile to keep header compact */
        header > div > div:last-child > div:last-child {
          display: none !important;
        }
        header > div > div:last-child {
          gap: 0 !important;
        }

        /* Hero — stack to one column */
        #top {
          grid-template-columns: 1fr !important;
          padding: 64px 20px 40px !important;
          gap: 24px !important;
        }
        #top h1 {
          font-size: clamp(38px, 11vw, 60px) !important;
          line-height: 1.05 !important;
        }
        #top p {
          font-size: 15px !important;
          max-width: 100% !important;
        }

        /* Section paddings */
        #work, #about, #cv, #contact {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }

        /* All top-level section grids stack (SectionHead + content layouts) */
        section > div {
          grid-template-columns: 1fr !important;
          gap: 12px !important;
        }
        /* Inner two-column layouts (1.4fr 1fr, 1fr 1fr, etc) stack too */
        section > div > div {
          grid-template-columns: 1fr !important;
          gap: 20px !important;
        }

        /* Section h2 sizing */
        section h2 {
          font-size: clamp(28px, 7.5vw, 42px) !important;
        }

        /* About pull-quote: drop sticky so it doesn't pin awkwardly */
        #about > div:nth-of-type(2) > div:first-child {
          position: static !important;
        }

        /* Project row collapsed button — keep year, title, + */
        #work article button {
          grid-template-columns: 52px 1fr 28px !important;
          gap: 10px !important;
          padding: 18px 0 !important;
        }
        #work article button > div > div:first-child {
          font-size: 19px !important;
          line-height: 1.15 !important;
        }

        /* Project expanded content grid: stack text + media */
        #work article > div > div > div {
          grid-template-columns: 1fr !important;
          gap: 18px !important;
        }

        /* Project bullets — keep tight 2-col within a project */
        /* (default 24px 1fr is fine on mobile) */

        /* CV details rows */
        #cv h3, #cv h4 { font-size: 14px !important; }

        /* Languages list: stay readable */
        #cv ul li[style*="grid"] { gap: 8px !important; }

        /* Contact section footer row: stack */
        #contact > div:last-child > div {
          flex-direction: column !important;
          align-items: flex-start !important;
          gap: 6px !important;
        }
        #contact > div:last-child {
          margin-top: 48px !important;
        }

        /* Tweaks panel: narrower so it fits on a phone */
        .twk-panel {
          width: calc(100vw - 24px) !important;
          max-width: 320px !important;
          right: 12px !important;
          bottom: 12px !important;
        }

        /* Aura background: dial down so it doesn't dominate */
        :root [aria-hidden="true"] {
          filter: blur(50px);
        }
      }

      /* Phone-tight refinements */
      @media (max-width: 480px) {
        #top h1 {
          font-size: clamp(34px, 13vw, 52px) !important;
        }
        #top {
          padding-top: 56px !important;
        }
        section h2 {
          font-size: clamp(26px, 8vw, 38px) !important;
        }
        #work article button > div > div:first-child {
          font-size: 17px !important;
        }
        /* Round buttons in the contact section: full-width pills */
        #contact a[href^="https://www.linkedin"],
        #contact a[href^="https://github.com"] {
          width: 100% !important;
          justify-content: center !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="__boot" class="__boot">loading · jessica rieger</div>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel" src="portfolio.jsx"></script>
    <script type="text/babel">
      const boot = document.getElementById('__boot');
      if (boot) boot.remove();
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
